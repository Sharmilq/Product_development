name: DentNova QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa_validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'dentnova-web/package.json'

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Node.js Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Install Web Frontend Dependencies & Build
      run: |
        cd dentnova-web
        npm install
        npm run build

    - name: Install Python QA Dependencies
      run: |
        pip install -r tests/selenium/requirements.txt
        pip install -r tests/appium/requirements.txt

    - name: Run Web Unit Tests (Vitest)
      run: |
        cd dentnova-web
        npm test -- --run || echo "No test script found"

    - name: Run Backend Unit Tests (Jest)
      run: |
        cd backend
        npm test || echo "No Jest tests configured"

    - name: Install Python QA Dependencies
      run: |
        pip install pandas openpyxl reportlab
        
    - name: Setup K6 Load Testing
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Start Background Web Server
      run: |
        cd dentnova-web
        npm run dev &
        sleep 5
        
    - name: Run Appium Tests in Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        script: |
          cd Testing
          npm install
          bash run_all_tests.sh || echo "Some tests failed but generating report anyway."

    - name: Upload Complete QA Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DentNova_QA_Reports
        path: |
          Testing/Summary/
          Testing/Web_Selenium/reports/
          Testing/Web_Selenium/screenshots/
          Testing/Android_Appium/reports/
          Testing/Android_Appium/screenshots/

