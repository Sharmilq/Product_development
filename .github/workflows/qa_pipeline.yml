name: DentNova QA Automation Pipeline — 300 Web + 300 Android Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa_validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'dentnova-web/package.json'

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Node.js Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Install Web Frontend Dependencies & Build
      run: |
        cd dentnova-web
        npm install
        npm run build

    - name: Install Testing Framework Dependencies
      run: |
        cd Testing
        npm install

    - name: Install Python QA Dependencies
      run: |
        pip install pandas openpyxl reportlab

    - name: Setup k6 Load Testing Tool
      uses: grafana/setup-k6-action@v1

    - name: Start Background Vite Dev Server
      run: |
        cd dentnova-web
        npm run dev &
        sleep 8
        echo "Dev server started."

    - name: Run 300 Web Selenium Tests (TC001–TC300)
      run: |
        cd Testing
        npm run test:web || echo "Some web tests failed — continuing to generate report."
      continue-on-error: true

    - name: Run 300 Android Business Logic & Validation Tests (TC_A001–TC_A300)
      run: |
        cd Testing
        npm run test:android || echo "Some android tests failed — continuing to generate report."
      continue-on-error: true

    - name: Run k6 Load Tests
      run: |
        k6 run Testing/Load_Testing/k6/load_test_300.js --out json=Testing/Load_Testing/k6_results.json || echo "k6 load test done"
      continue-on-error: true

    - name: Generate Excel, HTML, CSV & PDF QA Reports
      if: always()
      run: |
        cd Testing
        python Summary/generate_summary_report.py

    - name: Upload DentNova_Test_Cases.xlsx as GitHub Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: QA Summary Reports
        path: Testing/Summary/DentNova_Test_Cases.xlsx

    - name: Upload Complete QA Reports Bundle as GitHub Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: QA Summary Reports
        path: |
          Testing/Summary/
          Testing/Web_Selenium/reports/
          Testing/Web_Selenium/screenshots/
          Testing/Android_Appium/reports/
          Testing/Android_Appium/screenshots/
