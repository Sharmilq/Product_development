name: DentNova QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa_validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'dentnova-web/package.json'

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Node.js Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Install Web Frontend Dependencies & Build
      run: |
        cd dentnova-web
        npm install
        npm run build

    - name: Install Python QA Dependencies
      run: |
        pip install -r tests/selenium/requirements.txt
        pip install -r tests/appium/requirements.txt

    - name: Run Web Unit Tests (Vitest)
      run: |
        cd dentnova-web
        # If npm test is defined in package.json, run it
        npm test -- --run || echo "No test script found"

    - name: Run Backend Unit Tests (Jest)
      run: |
        cd backend
        npm test || echo "No Jest tests configured"

    - name: Run All-in-One QA Suite and Report Generator
      env:
        TEST_OTP_URL: 'http://localhost:5000'
        TEST_ML_URL: 'https://dentnova-ml.onrender.com'
      run: |
        python tests/run_all_tests.py

    - name: Upload Test Reports Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dentnova-qa-reports
        path: |
          tests/reports/

