name: DentNova QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa_validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'dentnova-web/package.json'

    - name: Setup Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Node.js Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Install Web Frontend Dependencies & Build
      run: |
        cd dentnova-web
        npm install
        npm run build

    - name: Install Python QA Dependencies
      run: |
        pip install -r tests/selenium/requirements.txt
        pip install -r tests/appium/requirements.txt

    - name: Run Web Unit Tests (Vitest)
      run: |
        cd dentnova-web
        # If npm test is defined in package.json, run it
        npm test -- --run || echo "No test script found"

    - name: Run Backend Unit Tests (Jest)
      run: |
        cd backend
        npm test || echo "No Jest tests configured"

    - name: Run API Validation Tests
      env:
        TEST_OTP_URL: 'http://localhost:5000'
        TEST_ML_URL: 'https://dentnova-ml.onrender.com'
      run: |
        pytest tests/api/test_api.py --html=tests/reports/html/api_report.html --junit-xml=tests/reports/junit/api_report.xml || echo "API tests had failures"

    - name: Run Security Configuration Verification
      run: |
        python tests/security/zap_scan.py || echo "Security check failed"

    - name: Run Schema Integration Tests
      run: |
        pytest tests/integration/test_sync.py --html=tests/reports/html/sync_report.html --junit-xml=tests/reports/junit/sync_report.xml || echo "Sync tests failed"

    - name: Upload Test Reports Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dentnova-qa-reports
        path: |
          tests/reports/html/
          tests/reports/junit/
